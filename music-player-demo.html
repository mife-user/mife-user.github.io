<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正文音乐模块预览 - MIFE Blog</title>
<style>
    * { box-sizing: border-box; }
    :root {
        --bg-card: rgba(26, 26, 26, 0.9);
        --gold-primary: #d4af37;
        --gold-light: #f4d46a;
        --gold-dark: #aa8c2c;
        --text-primary: #fff;
        --text-secondary: #b0b0b0;
        --border-color: rgba(42, 42, 42, 0.8);
    }
    body {
        margin: 0;
        min-height: 100vh;
        padding: 2.5rem 1rem;
        color: var(--text-primary);
        background: radial-gradient(ellipse at top, #252013 0%, #101010 55%, #080808 100%);
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }
    .preview-top { max-width: 900px; margin: 0 auto 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .brand { color: var(--gold-primary); font-size: 1.4rem; font-weight: 700; letter-spacing: 0.04em; }
    .lang-btn { padding: 0.4rem 0.75rem; color: var(--gold-primary); background: transparent; border: 1px solid var(--gold-dark); border-radius: 6px; cursor: pointer; }
    .single-article {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(212, 175, 55, 0.1);
    }
    .article-header { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); }
    .article-title { margin: 0 0 0.5rem; font-size: 2rem; color: var(--gold-light); }
    .muted { color: var(--text-secondary); font-size: 0.9rem; }
    .content { line-height: 2; overflow-wrap: break-word; }
    .content h2 { margin: 2rem 0 0.8rem; font-size: 1.35rem; }
    .content p { margin: 0 0 1rem; }
    .content code { padding: 0.2rem 0.4rem; color: var(--gold-primary); background: rgba(212, 175, 55, 0.1); border-radius: 4px; }

    /* 与主题中正文音乐模块的样式保持一致。 */
    .content .embedded-audio {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: min(100%, 32rem);
        margin: 1rem 0;
        padding: 1rem 1.2rem;
        text-align: left;
        background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), transparent 65%), rgba(14, 14, 14, 0.92);
        border: 1px solid rgba(212, 175, 55, 0.28);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .content .embedded-audio-heading { display: flex; align-items: center; gap: 0.75rem; min-width: 0; line-height: 1.4; }
    .content .embedded-audio-icon { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 2.25rem; height: 2.25rem; color: var(--gold-primary); background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.24); border-radius: 8px; }
    .content .embedded-audio-icon svg { width: 1.15rem; height: 1.15rem; }
    .content .embedded-audio-name { min-width: 0; color: var(--gold-light); font-size: 0.95rem; font-weight: 600; overflow-wrap: anywhere; }
    .content .embedded-audio-element { display: block; width: 100%; min-width: 0; max-width: 100%; color-scheme: dark; accent-color: var(--gold-primary); }
    @media (max-width: 480px) {
        .single-article { padding: 1rem; }
        .article-title { font-size: 1.5rem; }
        .content .embedded-audio { padding: 0.85rem; }
    }
</style>
</head>
<body>
    <div class="preview-top"><span class="brand">MIFE Blog</span><button class="lang-btn" type="button">EN</button></div>
    <article class="single-article">
        <header class="article-header">
            <h1 class="article-title" data-zh="正文音乐模块预览" data-en="Embedded audio preview">正文音乐模块预览</h1>
            <span class="muted" data-zh="文章与项目共用 · 黑金主题" data-en="Shared by articles and projects · black and gold">文章与项目共用 · 黑金主题</span>
        </header>
        <div class="content">
            <p data-zh="下面的控件使用本页生成的演示音频，可以直接播放；原生控件的具体外观会因浏览器不同而变化。" data-en="The controls play a sample generated by this page. Native controls vary between browsers.">下面的控件使用本页生成的演示音频，可以直接播放；原生控件的具体外观会因浏览器不同而变化。</p>
            <h2 data-zh="默认标题" data-en="Default title">默认标题</h2>
            <p><code>![音乐](/voices/学习.mp3)</code></p>
            <p><span class="embedded-audio">
                <span class="embedded-audio-heading">
                    <span class="embedded-audio-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path></svg></span>
                    <span class="embedded-audio-name" id="demo-audio-1" data-zh="音乐" data-en="Music">音乐</span>
                </span>
                <audio class="embedded-audio-element" controls preload="none" aria-labelledby="demo-audio-1">您的浏览器不支持音频播放。</audio>
            </span></p>
            <h2 data-zh="自定义标题" data-en="Custom title">自定义标题</h2>
            <p><code>![音乐](/voices/学习.mp3 "学习旋律")</code></p>
            <p><span class="embedded-audio">
                <span class="embedded-audio-heading">
                    <span class="embedded-audio-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path></svg></span>
                    <span class="embedded-audio-name" id="demo-audio-2">学习旋律</span>
                </span>
                <audio class="embedded-audio-element" controls preload="none" aria-labelledby="demo-audio-2">您的浏览器不支持音频播放。</audio>
            </span></p>
        </div>
    </article>
<script>
(function() {
    // 使用浏览器生成简短的 WAV，预览无需加载任何外部文件。
    var rate = 22050, noteLength = 0.55, notes = [261.63, 329.63, 392, 523.25];
    var samples = Math.floor(rate * noteLength * notes.length);
    var buffer = new ArrayBuffer(44 + samples * 2), view = new DataView(buffer);
    function text(offset, value) { for (var i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i)); }
    text(0, 'RIFF'); view.setUint32(4, 36 + samples * 2, true); text(8, 'WAVE'); text(12, 'fmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    text(36, 'data'); view.setUint32(40, samples * 2, true);
    for (var n = 0; n < samples; n++) {
        var t = n / rate, phase = t % noteLength;
        var envelope = Math.min(phase / 0.03, 1) * Math.min((noteLength - phase) / 0.12, 1);
        view.setInt16(44 + n * 2, Math.sin(2 * Math.PI * notes[Math.floor(t / noteLength)] * t) * envelope * 7000, true);
    }
    var sampleURL = URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
    var players = document.querySelectorAll('.embedded-audio-element');
    players.forEach(function(audio) {
        audio.src = sampleURL;
        audio.addEventListener('play', function() {
            players.forEach(function(other) { if (other !== audio) other.pause(); });
        });
    });
    var lang = 'zh', button = document.querySelector('.lang-btn');
    button.addEventListener('click', function() {
        lang = lang === 'zh' ? 'en' : 'zh';
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        button.textContent = lang === 'zh' ? 'EN' : '中文';
        document.querySelectorAll('[data-zh][data-en]').forEach(function(el) { el.textContent = el.getAttribute('data-' + lang); });
    });
})();
</script>
</body>
</html>
