{{ define "main" }}
<!-- 个人简介 -->
<section id="about" class="hero">
    <div class="avatar" title="{{ .Site.Params.username }}"></div>
    <h1>{{ .Site.Params.author }}</h1>
    <p class="username">@{{ .Site.Params.username }}</p>
    <p class="bio" data-zh="{{ .Site.Params.bio }}" data-en="Developer · Creator · Explorer">{{ .Site.Params.bio }}</p>
    <div class="social-links">
        <a href="{{ .Site.Params.github }}" target="_blank" data-zh="GitHub" data-en="GitHub">GitHub</a>
        <a href="mailto:{{ .Site.Params.email }}" data-zh="邮箱" data-en="Email">邮箱</a>
    </div>
</section>
{{ end }}
