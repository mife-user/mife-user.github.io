{{ define "main" }}
<article class="single-article guestbook-page">
    <!-- ===== 顶部：徽章 + 流光标题 + 副标题 ===== -->
    <header class="article-header">
        <span class="guestbook-badge" data-zh="💬 留言板" data-en="💬 GUESTBOOK">💬 留言板</span>
        <h1 class="article-title">{{ .Title }}</h1>
        <p class="guestbook-subtitle" data-zh="说说你的想法，这里会为你认真对待" data-en="Share your thoughts — every word counts">说说你的想法，这里会为你认真对待</p>
    </header>

    <!-- ===== 提示卡片 ===== -->
    <div class="guestbook-tip">
        <div class="tip-icon">👋</div>
        <div class="tip-body">
            <p class="tip-title" data-zh="欢迎来聊" data-en="Welcome">欢迎来聊</p>
            <p class="tip-text">
                <span data-zh="可以提改进建议、问技术问题，或纯粹唠唠嗑。" data-en="Share feedback, ask technical questions, or just have a chat. ">可以提改进建议、问技术问题，或纯粹唠唠嗑。 </span>
                <a href="https://github.com/{{ .Site.Params.githubUsername | default "mife-user" }}/{{ .Site.Params.repo | default "mife-user.github.io" }}/issues/5" target="_blank" rel="noopener noreferrer">Issue #5</a>
                <span data-zh="，使用 GitHub 账号登录。" data-en=" — sign in with your GitHub account to join.">，使用 GitHub 账号登录。</span>
            </p>
        </div>
    </div>

    <!-- ===== 亮点 chips ===== -->
    <div class="guestbook-features">
        <div class="gb-feature">
            <span>🌏</span>
            <p data-zh="人生" data-en="LIFE">人生</p>
        </div>
        <div class="gb-feature">
            <span>🔮</span>
            <p data-zh="梦想" data-en="DREAM">梦想</p>
        </div>
        <div class="gb-feature">
            <span>❔</span>
            <p data-zh="思考" data-en="THINKING">思考</p>
        </div>
    </div>

    <!-- ===== 正文 ===== -->
    <div class="content guestbook-intro">
        {{ .Content }}
    </div>

    {{ partial "utterances-comments.html" . }}
</article>

<style>
    .guestbook-page {
        max-width: 900px;
        margin: 0 auto;
        padding: 2.5rem;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                    0 0 40px rgba(212, 175, 55, 0.1);
        animation: fadeInUp 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) both;
        position: relative;
        overflow: hidden;
    }

    /* 顶部内发光点缀 */
    .guestbook-page::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        opacity: 0.6;
    }

    /* ---- 徽章 ---- */
    .guestbook-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.35rem 1.1rem;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 1.5px;
        color: var(--gold-primary);
        background: rgba(212, 175, 55, 0.1);
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 30px;
        margin-bottom: 1.3rem;
        text-transform: uppercase;
        box-shadow: 0 2px 12px rgba(212, 175, 55, 0.15);
        transition: all 0.35s ease;
    }
    .guestbook-badge:hover {
        background: rgba(212, 175, 55, 0.18);
        box-shadow: 0 4px 18px rgba(212, 175, 55, 0.3);
        transform: translateY(-2px);
    }

    /* ---- 标题区 ---- */
    .article-header {
        margin-bottom: 2.2rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--border-color);
        position: relative;
    }
    .article-header::before {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 100px;
        height: 3px;
        background: linear-gradient(90deg, var(--gold-primary), var(--gold-light));
        border-radius: 3px;
    }

    .article-title {
        font-size: 2.4rem;
        margin: 0 0 0.6rem;
        line-height: 1.3;
        background: linear-gradient(120deg,
            var(--gold-primary) 0%, var(--gold-light) 40%,
            #fff3c4 50%, var(--gold-light) 60%, var(--gold-primary) 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: goldShimmer 7s linear infinite;
    }

    .guestbook-subtitle {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.92rem;
        letter-spacing: 1px;
    }

    /* ---- 提示卡片 ---- */
    .guestbook-tip {
        display: flex;
        align-items: flex-start;
        gap: 1.2rem;
        padding: 1.4rem 1.6rem;
        margin-bottom: 1.6rem;
        background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(26, 26, 26, 0.6));
        border: 1px solid rgba(212, 175, 55, 0.25);
        border-left: 3px solid var(--gold-primary);
        border-radius: 12px;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .guestbook-tip:hover {
        border-color: rgba(212, 175, 55, 0.45);
        box-shadow: 0 8px 25px rgba(212, 175, 55, 0.12);
        transform: translateY(-2px);
    }

    .tip-icon {
        flex-shrink: 0;
        width: 46px;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        background: rgba(212, 175, 55, 0.12);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
    }

    .tip-body {
        flex: 1;
        min-width: 0;
    }
    .tip-title {
        margin: 0 0 0.4rem;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--gold-light);
        letter-spacing: 0.5px;
    }
    .tip-text {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.9;
        color: var(--text-secondary);
    }
    .tip-text a {
        color: var(--gold-primary);
        text-decoration: none;
        font-weight: 600;
        border-bottom: 1px solid transparent;
        transition: all 0.25s ease;
    }
    .tip-text a:hover {
        color: var(--gold-light);
        border-bottom-color: var(--gold-primary);
    }

    /* ---- 亮点 chips ---- */
    .guestbook-features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-bottom: 2.2rem;
    }
    .gb-feature {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        padding: 1.2rem 0.8rem;
        background: rgba(26, 26, 26, 0.5);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        text-align: center;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gb-feature span {
        font-size: 1.6rem;
        line-height: 1;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gb-feature p {
        margin: 0;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
        transition: color 0.3s ease;
    }
    .gb-feature:hover {
        border-color: rgba(212, 175, 55, 0.45);
        background: rgba(212, 175, 55, 0.05);
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(212, 175, 55, 0.12);
    }
    .gb-feature:hover span {
        transform: scale(1.15) rotate(-6deg);
    }
    .gb-feature:hover p {
        color: var(--gold-light);
    }

    /* ---- 正文 ---- */
    .guestbook-intro {
        line-height: 2;
        color: var(--text-secondary);
        font-size: 1.02rem;
        margin-bottom: 1.2rem;
        padding-bottom: 1.2rem;
        border-bottom: 1px solid var(--border-color);
    }
    .guestbook-intro p {
        margin-bottom: 1rem;
    }
    .guestbook-intro p:last-child {
        margin-bottom: 0;
    }
    .guestbook-intro a {
        color: var(--gold-primary);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: all 0.25s ease;
    }
    .guestbook-intro a:hover {
        color: var(--gold-light);
        border-bottom-color: var(--gold-primary);
    }

    /* ---- 题诗（中英双语，跟随 html[lang] 切换） ---- */
    .guestbook-poem {
        text-align: center;
        padding: 0.4rem 0 1.6rem;
    }
    .guestbook-poem-en {
        display: none;
    }
    html[lang="en"] .guestbook-poem-zh {
        display: none;
    }
    html[lang="en"] .guestbook-poem-en {
        display: block;
    }
    .guestbook-poem-title {
        font-size: 1.2rem;
        letter-spacing: 3px;
        color: var(--gold-primary);
        text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }
    .guestbook-poem-title::after {
        content: '';
        display: block;
        width: 48px;
        height: 2px;
        margin: 0.7rem auto 0;
        background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        border-radius: 2px;
    }
    .guestbook-poem-body {
        margin-top: 0.9rem;
        line-height: 2.3;
        letter-spacing: 1px;
        font-size: 1.05rem;
        color: var(--text-secondary);
    }

    /* ---- 减少动态偏好 ---- */
    @media (prefers-reduced-motion: reduce) {
        .article-title {
            animation: none;
        }
        .guestbook-page,
        .guestbook-badge:hover,
        .guestbook-tip:hover,
        .gb-feature:hover {
            transform: none;
            transition: none;
        }
    }

    /* ---- 平板 ---- */
    @media (max-width: 768px) {
        .guestbook-page {
            padding: 1.5rem;
        }
        .article-title {
            font-size: 1.8rem;
        }
        .guestbook-features {
            gap: 0.7rem;
        }
        .gb-feature {
            padding: 1rem 0.5rem;
        }
        .gb-feature span {
            font-size: 1.4rem;
        }
        .guestbook-tip {
            padding: 1.1rem 1.2rem;
            gap: 1rem;
        }
    }

    /* ---- 手机 ---- */
    @media (max-width: 480px) {
        .guestbook-page {
            padding: 1.2rem;
        }
        .article-title {
            font-size: 1.6rem;
        }
        .guestbook-subtitle {
            font-size: 0.85rem;
        }
        .guestbook-features {
            gap: 0.5rem;
        }
        .gb-feature p {
            font-size: 0.78rem;
        }
        .tip-icon {
            width: 38px;
            height: 38px;
            font-size: 1.2rem;
        }
        .tip-title {
            font-size: 1rem;
        }
        .tip-text {
            font-size: 0.9rem;
        }
    }
</style>
{{ end }}
