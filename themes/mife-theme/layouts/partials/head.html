<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg-primary: rgba(10, 10, 10, 0.85);
        --bg-secondary: rgba(18, 18, 18, 0.9);
        --bg-card: rgba(26, 26, 26, 0.9);
        --gold-primary: #d4af37;
        --gold-light: #f4d46a;
        --gold-dark: #aa8c2c;
        --text-primary: #ffffff;
        --text-secondary: #b0b0b0;
        --text-muted: #666666;
        --border-color: rgba(42, 42, 42, 0.8);
    }

    html {
        scroll-behavior: smooth;
        scroll-padding-top: 100px;
    }

    body {
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.8;
        color: var(--text-primary);
        background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)),
                    url('{{ .Site.Params.background | relURL }}') no-repeat center top;
        background-size: cover;
        background-attachment: scroll;
        min-height: 100vh;
        -webkit-background-size: cover;
        -moz-background-size: cover;
        -o-background-size: cover;
    }

    /* PC 端背景优化 - 视差效果 */
    @media (min-width: 1024px) {
        body {
            background-attachment: fixed;
        }
    }

    /* 移动端背景优化 - 禁用固定背景以提升性能 */
    @media (max-width: 768px) {
        body {
            background-attachment: scroll;
            background-position: center top;
        }
    }

    /* 小屏手机优化 */
    @media (max-width: 480px) {
        body {
            background-position: center center;
        }
    }

    /* 导航栏 */
    body > header {
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-color);
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    body > header nav {
        max-width: 1000px;
        margin: 0 auto;
        padding: 1.2rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 1.6rem;
        font-weight: 700;
        background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
        letter-spacing: 2px;
        transition: all 0.3s ease;
    }

    .logo:hover {
        transform: scale(1.05);
        filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));
    }

    .nav-links {
        display: flex;
        gap: 2.5rem;
        list-style: none;
    }

    .nav-links a {
        text-decoration: none;
        color: var(--text-secondary);
        transition: all 0.3s ease;
        font-size: 0.95rem;
        letter-spacing: 1px;
        position: relative;
        padding: 0.5rem 0;
    }

    .nav-links a::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--gold-primary), var(--gold-light));
        transition: width 0.3s ease;
    }

    .nav-links a:hover {
        color: var(--gold-primary);
    }

    .nav-links a:hover::after {
        width: 100%;
    }

    /* 导航栏语言切换按钮 */
    .lang-nav-item {
        display: flex;
        align-items: center;
    }

    .nav-links .lang-btn {
        padding: 0.4rem 0.9rem;
        font-size: 0.85rem;
        background: rgba(26, 26, 26, 0.9);
        border: 1px solid var(--gold-dark);
        border-radius: 20px;
        color: var(--gold-primary);
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
        font-family: inherit;
    }

    .nav-links .lang-btn:hover {
        background: var(--gold-primary);
        color: var(--bg-primary);
        transform: scale(1.05);
        box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
    }

    /* 主容器 */
    body > main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 120px 2rem 2rem;
    }

    /* 个人简介 */
    .hero {
        text-align: center;
        padding: 6rem 0;
        border-bottom: 1px solid var(--border-color);
        animation: fadeInUp 1s ease;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .avatar {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: url('{{ .Site.Params.avatar | relURL }}') no-repeat center center;
        background-size: cover;
        margin: 0 auto 2rem;
        border: 4px solid rgba(212, 175, 55, 0.6);
        box-shadow: 0 15px 50px rgba(212, 175, 55, 0.4),
                    0 0 30px rgba(212, 175, 55, 0.2),
                    inset 0 0 20px rgba(255, 255, 255, 0.1);
        transition: all 0.4s ease;
        cursor: pointer;
        animation: avatarGlow 3s ease-in-out infinite;
        position: relative;
        z-index: 1100;
    }

    @keyframes avatarGlow {
        0%, 100% {
            box-shadow: 0 15px 50px rgba(212, 175, 55, 0.4),
                        0 0 30px rgba(212, 175, 55, 0.2),
                        inset 0 0 20px rgba(255, 255, 255, 0.1);
        }
        50% {
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.6),
                        0 0 50px rgba(212, 175, 55, 0.4),
                        inset 0 0 30px rgba(255, 255, 255, 0.2);
        }
    }

    .avatar:hover {
        transform: scale(1.08) rotate(5deg);
        border-color: var(--gold-light);
        box-shadow: 0 25px 70px rgba(212, 175, 55, 0.7),
                    0 0 60px rgba(212, 175, 55, 0.5);
    }

    .hero h1 {
        font-size: 2.8rem;
        background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
        font-weight: 700;
        letter-spacing: 4px;
        text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    }

    .hero .username {
        font-size: 1.2rem;
        color: var(--gold-primary);
        letter-spacing: 3px;
        margin-bottom: 1rem;
        text-transform: uppercase;
    }

    .hero p {
        color: var(--text-secondary);
        max-width: 550px;
        margin: 0 auto;
        font-size: 1.1rem;
        line-height: 1.9;
    }

    .social-links {
        margin-top: 2.5rem;
        display: flex;
        justify-content: center;
        gap: 1.2rem;
        flex-wrap: wrap;
    }

    .social-links a, .btn {
        display: inline-block;
        padding: 0.8rem 1.8rem;
        border: 1px solid var(--border-color);
        border-radius: 30px;
        text-decoration: none;
        color: var(--text-secondary);
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        font-size: 0.95rem;
        letter-spacing: 1px;
        background: linear-gradient(135deg, rgba(26, 26, 26, 0.8), rgba(18, 18, 18, 0.9));
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4),
                    0 2px 8px rgba(0, 0, 0, 0.3),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .social-links a::before, .btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
        transition: left 0.5s ease;
    }

    .social-links a:hover, .btn:hover {
        background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
        border-color: var(--gold-primary);
        color: var(--bg-primary);
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 12px 35px rgba(212, 175, 55, 0.5),
                    0 6px 20px rgba(212, 175, 55, 0.3),
                    0 0 20px rgba(212, 175, 55, 0.2);
    }

    .social-links a:hover::before, .btn:hover::before {
        left: 100%;
    }

    .social-links a:active, .btn:active {
        transform: translateY(-2px) scale(0.98);
    }

    /* 文章列表 */
    .section {
        padding: 4rem 0;
    }

    .section-title {
        font-size: 1.8rem;
        background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 2.5rem;
        padding-bottom: 0.8rem;
        border-bottom: 2px solid var(--gold-dark);
        display: inline-block;
        letter-spacing: 2px;
        font-weight: 600;
    }

    .post-list {
        display: flex;
        flex-direction: column;
        gap: 2rem;
    }

    .post-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 2rem;
        transition: all 0.4s ease;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
    }

    .post-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: linear-gradient(180deg, var(--gold-light), var(--gold-primary));
        opacity: 0;
        transition: opacity 0.4s ease;
    }

    .post-card:hover {
        transform: translateY(-8px);
        border-color: var(--gold-dark);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                    0 10px 30px rgba(212, 175, 55, 0.2);
    }

    .post-card:hover::before {
        opacity: 1;
    }

    .post-date {
        color: var(--gold-primary);
        font-size: 0.85rem;
        margin-bottom: 0.8rem;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .post-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.8rem;
        flex-wrap: wrap;
        gap: 0.5rem;
    }

    .post-tags {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
    }

    .tag-link {
        background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
        color: var(--bg-primary);
        padding: 0.25rem 0.8rem;
        border-radius: 15px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(212, 175, 55, 0.2);
    }

    .tag-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
    }

    .post-title {
        font-size: 1.4rem;
        color: var(--text-primary);
        margin-bottom: 0.8rem;
        font-weight: 600;
    }

    .post-title a {
        text-decoration: none;
        color: inherit;
        transition: color 0.3s ease;
    }

    .post-title a:hover {
        color: var(--gold-primary);
    }

    .post-excerpt {
        color: var(--text-secondary);
        line-height: 1.9;
    }

    .read-more {
        display: inline-block;
        margin-top: 1.2rem;
        color: var(--gold-primary);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        border: 1px solid transparent;
    }

    .read-more:hover {
        color: var(--gold-light);
        background: rgba(212, 175, 55, 0.1);
        border-color: rgba(212, 175, 55, 0.3);
        padding-left: 1.5rem;
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
    }

    /* 项目展示 */
    .project-list {
        display: flex;
        flex-direction: column;
        gap: 2rem;
    }

    .project-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2rem;
    }

    .project-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 2rem;
        transition: all 0.4s ease;
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
    }

    .project-card:hover {
        transform: translateY(-8px);
        border-color: var(--gold-dark);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                    0 10px 30px rgba(212, 175, 55, 0.2);
    }

    .project-meta {
        margin-bottom: 1rem;
    }

    .project-title {
        font-size: 1.3rem;
        color: var(--text-primary);
        margin-bottom: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .project-title a {
        color: var(--text-primary);
        text-decoration: none;
        transition: color 0.3s ease;
    }

    .project-title a:hover {
        color: var(--gold-primary);
    }

    .project-tags {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
    }

    .tag {
        background: var(--bg-card);
        color: var(--gold-primary);
        padding: 0.35rem 0.9rem;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 500;
        border: 1px solid rgba(212, 175, 55, 0.3);
        transition: all 0.3s ease;
    }

    .tag:hover {
        background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
        color: var(--bg-primary);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
    }

    .project-desc {
        color: var(--text-secondary);
        font-size: 1rem;
        margin-bottom: 1.5rem;
        line-height: 1.8;
        flex-grow: 1;
    }

    .project-link {
        color: var(--gold-light);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
    }

    .project-link:hover {
        opacity: 0.8;
        transform: translateX(5px);
    }

    /* 页脚 */
    body > footer {
        background: var(--bg-secondary);
        border-top: 1px solid var(--border-color);
        color: var(--text-secondary);
        text-align: center;
        padding: 3rem 2rem;
        margin-top: 4rem;
        backdrop-filter: blur(10px);
    }

    body > footer p {
        opacity: 0.8;
        font-size: 0.95rem;
    }

    body > footer .gold-text {
        color: var(--gold-primary);
    }

    /* 文章分页 */
    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.6rem;
        margin-top: 2.5rem;
        flex-wrap: wrap;
    }

    .pagination-btn {
        min-width: 42px;
        height: 42px;
        padding: 0.5rem 0.9rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(26, 26, 26, 0.8), rgba(18, 18, 18, 0.9));
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 0.9rem;
        font-family: inherit;
        letter-spacing: 0.5px;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
    }

    .pagination-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.15), transparent);
        transition: left 0.5s ease;
    }

    .pagination-btn:hover {
        border-color: var(--gold-primary);
        color: var(--gold-primary);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
    }

    .pagination-btn:hover::before {
        left: 100%;
    }

    .pagination-btn.active {
        background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
        color: var(--bg-primary);
        border-color: var(--gold-primary);
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
    }

    .pagination-btn.disabled {
        opacity: 0.25;
        cursor: not-allowed;
        pointer-events: none;
    }

    /* 响应式基础优化 */
    img {
        max-width: 100%;
        height: auto;
        display: block;
    }

    .content, .post-content, .article {
        word-wrap: break-word;
        overflow-wrap: break-word;
        max-width: 100%;
    }

    .content img, .post-content img, .article img {
        max-width: 100%;
        height: auto;
        margin: 1.5rem auto;
    }

    pre, table {
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    /* 平板适配 (768px 以下) */
    @media (max-width: 768px) {
        body > header nav {
            padding: 0.8rem 1rem;
            flex-direction: column;
            gap: 0.8rem;
        }

        .nav-links {
            gap: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-links a {
            font-size: 0.9rem;
        }

        .search-nav-item {
            display: inline-block;
        }

        .search-btn {
            margin-left: 0.5rem;
            padding: 0.3rem;
        }

        .search-btn .search-icon {
            width: 20px;
            height: 20px;
        }

        .lang-nav-item {
            display: inline-block;
        }

        .nav-links .lang-btn {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }

        .logo {
            font-size: 1.4rem;
        }

        body > main {
            padding: 140px 1rem 1rem;
        }

        .hero {
            padding: 3rem 0;
        }

        .hero h1 {
            font-size: 2rem;
            letter-spacing: 2px;
        }

        .hero .username {
            font-size: 1rem;
        }

        .hero p {
            font-size: 1rem;
            padding: 0 1rem;
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin-bottom: 1.5rem;
        }

        .social-links {
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .social-links a, .btn {
            padding: 0.7rem 1.2rem;
            font-size: 0.9rem;
        }

        .section {
            padding: 2.5rem 0;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .post-card {
            padding: 1.5rem;
            margin: 0 0.5rem;
        }

        .post-title {
            font-size: 1.2rem;
        }

        .post-excerpt {
            font-size: 0.95rem;
        }

        .pagination {
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .pagination-btn {
            min-width: 38px;
            height: 38px;
            padding: 0.4rem 0.7rem;
            font-size: 0.85rem;
        }

        .project-grid {
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .project-card {
            padding: 1.5rem;
            margin: 0 0.5rem;
        }

        .project-title {
            font-size: 1.1rem;
        }

        .project-desc {
            font-size: 0.95rem;
        }

        .tag {
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
        }

        body > footer {
            padding: 2rem 1rem;
        }

        body > footer p {
            font-size: 0.85rem;
        }

        .lang-switch {
            top: 60px;
            right: 10px;
        }

        .lang-btn {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }

        article {
            padding: 1rem !important;
        }

        article h1 {
            font-size: 1.8rem !important;
        }

        .content {
            font-size: 1rem;
            line-height: 1.9;
        }
    }

    /* 小屏手机适配 (480px 以下) */
    @media (max-width: 480px) {
        body > header nav {
            padding: 0.6rem 0.8rem;
            gap: 0.5rem;
        }

        .logo {
            font-size: 1.2rem;
        }

        .nav-links {
            gap: 0.8rem;
        }

        .nav-links a {
            font-size: 0.85rem;
        }

        .nav-links .lang-btn {
            padding: 0.35rem 0.7rem;
            font-size: 0.8rem;
        }

        .hero {
            padding: 2rem 0;
        }

        .hero h1 {
            font-size: 1.6rem;
        }

        .hero p {
            font-size: 0.95rem;
        }

        .avatar {
            width: 100px;
            height: 100px;
            z-index: 1100;
        }

        .social-links {
            flex-direction: column;
            align-items: center;
        }

        .social-links a, .btn {
            width: 80%;
            text-align: center;
        }

        .pagination {
            gap: 0.4rem;
            margin-top: 1.8rem;
        }

        .pagination-btn {
            min-width: 34px;
            height: 34px;
            padding: 0.35rem 0.6rem;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .post-card, .project-card {
            padding: 1.2rem;
            border-radius: 8px;
        }

        .post-title {
            font-size: 1.1rem;
        }

        .section-title {
            font-size: 1.3rem;
        }

        code {
            font-size: 0.85rem;
        }

        blockquote {
            margin: 1rem 0;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
        }
    }

    /* 超小屏幕 (360px 以下) */
    @media (max-width: 360px) {
        .hero h1 {
            font-size: 1.4rem;
        }

        .nav-links a {
            font-size: 0.8rem;
        }

        .section-title {
            font-size: 1.2rem;
        }

        body > main {
            padding: 90px 0.5rem 0.5rem;
        }
    }

    /* 横屏模式优化 */
    @media (max-height: 500px) and (orientation: landscape) {
        .hero {
            padding: 2rem 0;
        }

        body > main {
            padding: 80px 2rem 2rem;
        }

        body > header nav {
            padding: 0.8rem 1rem;
        }
    }

    /* ========== 音乐播放器 — 音符按钮 + 播放列表 ========== */
    .music-player {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 1000;
    }

    /* 悬停桥 — 填补音符按钮与面板之间的间隙，鼠标过渡不中断 */
    .music-player::before {
        content: '';
        position: absolute;
        left: -4px;
        right: -4px;
        bottom: 100%;
        height: 14px;
    }

    /* ---- 主按钮（音符 FAB，小巧） ---- */
    .music-note-btn {
        position: relative;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid var(--gold-dark);
        background: rgba(10, 10, 10, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        cursor: pointer;
        outline: none;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5),
                    0 0 12px rgba(212, 175, 55, 0.15);
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                    border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .music-note-btn:hover {
        transform: scale(1.12) rotate(-6deg);
        border-color: var(--gold-primary);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6),
                    0 0 22px rgba(212, 175, 55, 0.4);
    }

    .music-note-btn:active {
        transform: scale(0.92);
    }

    /* 音符图标 */
    .music-note-icon {
        width: 18px;
        height: 18px;
        color: var(--gold-primary);
        filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.5));
        transition: opacity 0.25s ease,
                    transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 播放中：音符退场，均衡器登场 */
    .music-note-btn.playing .music-note-icon {
        opacity: 0;
        transform: scale(0.3) rotate(25deg);
    }

    /* 均衡器（FAB 播放态） */
    .music-eq {
        position: absolute;
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 14px;
        opacity: 0;
        transform: scale(0.4);
        transition: opacity 0.25s ease,
                    transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .music-note-btn.playing .music-eq {
        opacity: 1;
        transform: scale(1);
    }

    .eq-bar {
        width: 3px;
        border-radius: 2px;
        background: linear-gradient(180deg, var(--gold-light), var(--gold-primary));
        transform-origin: bottom;
        animation: eqBounce 0.9s ease-in-out infinite;
    }

    .music-eq .eq-bar:nth-child(1) { height: 8px;  animation-delay: 0s; }
    .music-eq .eq-bar:nth-child(2) { height: 14px; animation-delay: 0.15s; }
    .music-eq .eq-bar:nth-child(3) { height: 10px; animation-delay: 0.3s; }

    @keyframes eqBounce {
        0%, 100% { transform: scaleY(0.45); }
        50%      { transform: scaleY(1.2); }
    }

    /* 播放中扩散光环 */
    .music-note-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--gold-primary);
        opacity: 0;
        pointer-events: none;
    }

    .music-note-btn.playing .music-note-ring {
        animation: ringPulse 1.6s ease-out infinite;
    }

    @keyframes ringPulse {
        0%   { transform: scale(1);   opacity: 0.7; }
        100% { transform: scale(1.9); opacity: 0; }
    }

    /* ---- 播放列表面板 ---- */
    .music-panel {
        position: absolute;
        right: 0;
        bottom: calc(100% + 14px);
        width: 252px;
        display: flex;
        flex-direction: column;
        background: rgba(14, 14, 14, 0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65),
                    0 0 24px rgba(212, 175, 55, 0.12);
        opacity: 0;
        visibility: hidden;
        transform: translateY(12px) scale(0.85);
        transform-origin: bottom right;
        transition: opacity 0.28s ease,
                    transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1),
                    visibility 0.28s;
    }

    .music-panel.open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
    }

    /* 顶部金色描边 */
    .music-panel::before {
        content: '';
        position: absolute;
        top: -1px;
        left: 14px;
        right: 14px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
    }

    .music-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.65rem 0.9rem;
        border-bottom: 1px solid var(--border-color);
    }

    .music-panel-title {
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 2px;
        color: var(--gold-primary);
    }

    .music-panel-controls {
        display: flex;
        gap: 0.35rem;
    }

    .music-panel-btn {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1px solid var(--border-color);
        background: rgba(26, 26, 26, 0.8);
        color: var(--gold-primary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s ease;
    }

    .music-panel-btn:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        transform: scale(1.1);
    }

    .music-panel-btn:active {
        transform: scale(0.9);
    }

    /* ---- 播放进度条 ---- */
    .music-progress {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 0.9rem 0.7rem;
        border-bottom: 1px solid var(--border-color);
    }

    .music-time {
        font-size: 0.7rem;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
        min-width: 34px;
        text-align: center;
        flex-shrink: 0;
    }

    .music-seek {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        cursor: pointer;
        outline: none;
        min-height: 14px;
    }

    .music-seek::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg,
                    var(--gold-primary) var(--seek-pct, 0%),
                    rgba(255, 255, 255, 0.12) var(--seek-pct, 0%));
    }

    .music-seek::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 11px;
        height: 11px;
        margin-top: -3.5px;
        border-radius: 50%;
        background: var(--gold-primary);
        border: 2px solid var(--gold-light);
        box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        transition: transform 0.2s ease;
    }

    .music-seek:hover::-webkit-slider-thumb {
        transform: scale(1.25);
    }

    .music-seek::-moz-range-track {
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
    }

    .music-seek::-moz-range-progress {
        height: 4px;
        border-radius: 2px;
        background: var(--gold-primary);
    }

    .music-seek::-moz-range-thumb {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--gold-primary);
        border: 2px solid var(--gold-light);
        box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    }

    /* 上一首 / 下一首 — CSS 三角 */
    .music-ctrl-prev::before,
    .music-ctrl-next::before {
        content: '';
        width: 0;
        height: 0;
        border-style: solid;
    }

    .music-ctrl-prev::before {
        border-width: 4px 6px 4px 0;
        border-color: transparent currentColor transparent transparent;
        margin-left: -1px;
    }

    .music-ctrl-next::before {
        border-width: 4px 0 4px 6px;
        border-color: transparent transparent transparent currentColor;
        margin-right: -1px;
    }

    /* 播放/暂停 — 三角 ↔ 双竖条 */
    .music-ctrl-play::before {
        content: '';
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 4px 0 4px 7px;
        border-color: transparent transparent transparent currentColor;
        margin-left: 2px;
        transition: all 0.25s ease;
    }

    .music-ctrl-play.playing::before {
        width: 2px;
        height: 9px;
        border: none;
        background: currentColor;
        box-shadow: 4px 0 0 currentColor;
        margin-left: 0;
    }

    /* ---- 曲目列表 ---- */
    .music-list {
        list-style: none;
        margin: 0;
        padding: 0.4rem;
        overflow-y: auto;
        max-height: 236px;
        scrollbar-width: thin;
        scrollbar-color: var(--gold-dark) transparent;
    }

    .music-list::-webkit-scrollbar {
        width: 4px;
    }

    .music-list::-webkit-scrollbar-thumb {
        background: var(--gold-dark);
        border-radius: 2px;
    }

    .music-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.5rem 0.6rem;
        border-radius: 8px;
        cursor: pointer;
        color: var(--text-secondary);
        font-size: 0.85rem;
        transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
    }

    .music-item.item-in {
        animation: itemIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes itemIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .music-item:hover {
        background: rgba(212, 175, 55, 0.08);
        color: var(--text-primary);
        transform: translateX(3px);
    }

    .music-item.active {
        color: var(--gold-light);
        background: rgba(212, 175, 55, 0.1);
        box-shadow: inset 2px 0 0 var(--gold-primary);
    }

    .music-item-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* 列表项均衡器 — 仅当前曲目跳动 */
    .music-item-eq {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        width: 12px;
        height: 12px;
        flex-shrink: 0;
    }

    .music-item-eq .eq-bar {
        height: 12px;
        width: 2px;
        opacity: 0.3;
    }

    .music-item.active .music-item-eq .eq-bar {
        opacity: 1;
    }

    .music-item:not(.active) .music-item-eq .eq-bar {
        animation: none;
        transform: scaleY(0.35);
    }

    /* ---- 移动端适配 ---- */
    @media (max-width: 600px) {
        .music-player {
            bottom: 20px;
            right: 20px;
        }

        .music-note-btn {
            width: 38px;
            height: 38px;
        }

        .music-note-icon {
            width: 16px;
            height: 16px;
        }

        .music-panel {
            width: min(252px, calc(100vw - 40px));
            max-height: 60vh;
        }

        .music-list {
            max-height: 40vh;
        }
    }

    /* 搜索按钮样式 */
    .search-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0.5rem;
        margin-left: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .search-btn:hover {
        transform: scale(1.1);
    }

    .search-btn .search-icon {
        width: 22px;
        height: 22px;
        color: var(--gold-primary);
    }

    /* 搜索弹窗样式 */
    .search-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(5px);
        z-index: 2000;
        display: none;
        justify-content: center;
        align-items: flex-start;
        padding-top: 100px;
    }

    .search-overlay.active {
        display: flex;
    }

    .search-modal {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        width: 90%;
        max-width: 600px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7),
                    0 0 30px rgba(212, 175, 55, 0.2);
        overflow: hidden;
    }

    .search-header {
        display: flex;
        align-items: center;
        padding: 1.2rem 1.5rem;
        border-bottom: 1px solid var(--border-color);
        background: rgba(10, 10, 10, 0.95);
    }

    .search-icon-large {
        width: 24px;
        height: 24px;
        color: var(--gold-primary);
        margin-right: 1rem;
        flex-shrink: 0;
    }

    .search-input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-primary);
        font-size: 1.1rem;
        outline: none;
        padding: 0.5rem 0;
    }

    .search-input::placeholder {
        color: var(--text-muted);
    }

    .search-close {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0.3rem 0.5rem;
        transition: all 0.3s ease;
        border-radius: 5px;
    }

    .search-close:hover {
        color: var(--gold-primary);
        background: rgba(212, 175, 55, 0.1);
    }

    .search-confirm {
        background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
        border: none;
        color: var(--bg-primary);
        cursor: pointer;
        padding: 0.5rem 1rem;
        margin-left: 0.5rem;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
    }

    .search-confirm:hover {
        background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
        transform: scale(1.05);
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5);
    }

    .search-confirm:active {
        transform: scale(0.95);
    }

    .search-confirm-icon {
        width: 20px;
        height: 20px;
    }

    .search-results {
        max-height: 400px;
        overflow-y: auto;
        padding: 1rem;
    }

    .search-results:empty::before {
        content: '输入关键词开始搜索...';
        color: var(--text-muted);
        display: block;
        text-align: center;
        padding: 2rem;
    }

    .search-result-item {
        padding: 1rem;
        margin-bottom: 0.8rem;
        background: rgba(26, 26, 26, 0.6);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        transition: all 0.3s ease;
        cursor: pointer;
        text-decoration: none;
        display: block;
    }

    .search-result-item:hover {
        border-color: var(--gold-dark);
        background: rgba(26, 26, 26, 0.9);
        transform: translateX(5px);
    }

    .search-result-title {
        color: var(--gold-primary);
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
    }

    .search-result-meta {
        color: var(--text-secondary);
        font-size: 0.85rem;
        display: flex;
        gap: 1rem;
        align-items: center;
    }

    .search-result-date {
        color: var(--text-muted);
    }

    .search-result-tag {
        background: rgba(212, 175, 55, 0.2);
        color: var(--gold-light);
        padding: 0.2rem 0.6rem;
        border-radius: 12px;
        font-size: 0.75rem;
    }

    .search-no-results {
        text-align: center;
        padding: 2rem;
        color: var(--text-muted);
    }

    /* 友情链接样式 */
    /* 友情链接页面 — 数据驱动（data/links.json）+ 磁吸卡片 */
    .fl-header {
        text-align: center;
        margin-bottom: 3rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--border-color);
        animation: favFadeInUp 0.6s ease both;
    }
    .fl-main-title {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 0.6rem;
        border-bottom: none;
        padding-bottom: 0;
    }
    .fl-title-icon {
        display: inline-block;
        animation: favFloat 3s ease-in-out infinite;
        font-size: 2rem;
    }
    .fl-subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
        letter-spacing: 0.5px;
    }

    .fl-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 2rem;
        margin-bottom: 3rem;
        perspective: 1200px;
    }

    /* 卡片容器 — JS 注入 --fl-rx/--fl-ry 实现 3D 倾斜 */
    .fl-card {
        position: relative;
        border-radius: 16px;
        transform: perspective(1000px) rotateX(var(--fl-rx, 0deg)) rotateY(var(--fl-ry, 0deg));
        transition: transform 0.25s ease-out;
        transform-style: preserve-3d;
        opacity: 0;
        translate: 0 24px;
    }
    .fl-card--visible {
        opacity: 1;
        translate: 0 0;
        transition: transform 0.25s ease-out,
                    opacity 0.55s ease var(--fl-delay, 0ms),
                    translate 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) var(--fl-delay, 0ms);
    }

    /* 鼠标光斑 — 位置由 JS 注入 --fl-gx/--fl-gy */
    .fl-card-glow {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: radial-gradient(320px circle at var(--fl-gx, 50%) var(--fl-gy, 50%),
                    rgba(212, 175, 55, 0.14), transparent 65%);
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 1;
    }
    .fl-card:hover .fl-card-glow {
        opacity: 1;
    }

    .fl-link {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        background: linear-gradient(160deg, rgba(30, 30, 30, 0.85), rgba(16, 16, 16, 0.9));
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 2.4rem 1.6rem 1.8rem;
        text-decoration: none;
        color: inherit;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
        height: 100%;
        transition: border-color 0.35s ease, box-shadow 0.35s ease;
    }

    /* 顶部流光金线 — 无限流动 */
    .fl-link::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg,
            transparent, var(--gold-dark), var(--gold-light),
            var(--gold-primary), var(--gold-light), var(--gold-dark), transparent);
        background-size: 250% 100%;
        opacity: 0;
        transition: opacity 0.35s ease;
    }
    .fl-card:hover .fl-link::before {
        opacity: 1;
        animation: flFlow 2.2s linear infinite;
    }
    @keyframes flFlow {
        from { background-position: 0% 0; }
        to   { background-position: 250% 0; }
    }

    /* 光扫效果 */
    .fl-link::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(105deg,
            transparent 40%,
            rgba(212, 175, 55, 0.05) 48%,
            rgba(212, 175, 55, 0.09) 50%,
            rgba(212, 175, 55, 0.05) 52%,
            transparent 60%);
        transition: left 0.7s ease;
        pointer-events: none;
    }
    .fl-card:hover .fl-link::after {
        left: 100%;
    }

    .fl-card:hover .fl-link {
        border-color: rgba(212, 175, 55, 0.5);
        box-shadow: 0 24px 55px rgba(0, 0, 0, 0.65),
                    0 0 30px rgba(212, 175, 55, 0.12),
                    inset 0 0 0 1px rgba(212, 175, 55, 0.08);
    }

    /* 头像 + 旋转光环 */
    .fl-avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        margin-bottom: 1.3rem;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid var(--gold-primary);
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        overflow: hidden;
        background: rgba(212, 175, 55, 0.06);
        transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        transform: translateZ(40px);
    }
    .fl-avatar-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.45s ease;
    }
    .fl-avatar-icon {
        font-size: 2.2rem;
        line-height: 1;
    }
    /* 旋转虚线光环 */
    .fl-avatar-ring {
        position: absolute;
        inset: -9px;
        border-radius: 50%;
        border: 2px dashed rgba(212, 175, 55, 0.45);
        animation: flSpin 14s linear infinite;
        pointer-events: none;
    }
    @keyframes flSpin {
        to { transform: rotate(360deg); }
    }
    .fl-card:hover .fl-avatar {
        transform: translateZ(40px) scale(1.08) rotate(4deg);
        border-color: var(--gold-light);
        box-shadow: 0 8px 28px rgba(212, 175, 55, 0.55);
    }
    .fl-card:hover .fl-avatar-img {
        transform: scale(1.15);
    }
    .fl-card:hover .fl-avatar-ring {
        animation-duration: 4s;
        border-color: rgba(244, 212, 106, 0.8);
    }

    .fl-name {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--gold-primary);
        margin-bottom: 0.6rem;
        transition: color 0.3s ease;
        transform: translateZ(30px);
    }
    .fl-card:hover .fl-name {
        color: var(--gold-light);
        text-shadow: 0 0 18px rgba(244, 212, 106, 0.4);
    }

    .fl-bio {
        color: var(--text-secondary);
        font-size: 0.92rem;
        line-height: 1.6;
        margin: 0 0 1.1rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    /* 底部元信息：标签 + 域名 */
    .fl-foot {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: auto;
    }
    .fl-tag {
        font-size: 0.72rem;
        background: rgba(212, 175, 55, 0.15);
        color: var(--gold-primary);
        padding: 0.12rem 0.6rem;
        border-radius: 10px;
        font-weight: 500;
        border: 1px solid rgba(212, 175, 55, 0.25);
    }
    .fl-domain {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-family: 'SF Mono', 'Consolas', monospace;
        letter-spacing: 0.3px;
    }

    /* 外链箭头 — 悬浮时从右上滑入 */
    .fl-arrow {
        position: absolute;
        top: 1rem;
        right: 1.1rem;
        color: var(--gold-primary);
        font-size: 0.95rem;
        opacity: 0;
        transform: translate(-8px, 8px);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 2;
    }
    .fl-card:hover .fl-arrow {
        opacity: 1;
        transform: translate(0, 0);
    }

    /* 空状态 */
    .fl-empty {
        text-align: center;
        padding: 4rem 2rem;
        animation: favFadeInScale 0.5s ease both;
    }
    .fl-empty-icon {
        font-size: 4rem;
        display: block;
        margin-bottom: 1rem;
        animation: favFloat 3s ease-in-out infinite;
    }
    .fl-empty-text {
        color: var(--text-muted);
        font-size: 1rem;
        letter-spacing: 0.5px;
    }

    .add-link-container {
        text-align: center;
        margin-top: 2rem;
    }

    .add-link-btn {
        background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
        color: var(--bg-primary);
        border: none;
        padding: 0.8rem 2rem;
        border-radius: 30px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }

    .add-link-btn:hover {
        background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 12px 35px rgba(212, 175, 55, 0.5);
    }

    .add-link-btn:active {
        transform: translateY(-2px) scale(0.98);
    }

    /* 模态框样式 */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(5px);
        z-index: 2000;
        display: none;
        justify-content: center;
        align-items: flex-start;
        padding-top: 100px;
    }

    .modal-overlay.active {
        display: flex;
    }

    .modal-content {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7),
                    0 0 30px rgba(212, 175, 55, 0.2);
        overflow: hidden;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.2rem 1.5rem;
        border-bottom: 1px solid var(--border-color);
        background: rgba(10, 10, 10, 0.95);
    }

    .modal-header h3 {
        color: var(--gold-primary);
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .modal-close {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0.3rem 0.5rem;
        transition: all 0.3s ease;
        border-radius: 5px;
    }

    .modal-close:hover {
        color: var(--gold-primary);
        background: rgba(212, 175, 55, 0.1);
    }

    .modal-body {
        padding: 1.5rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        color: var(--text-secondary);
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
        font-weight: 500;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 0.8rem;
        background: rgba(10, 10, 10, 0.8);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        color: var(--text-primary);
        font-size: 1rem;
        outline: none;
        transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: var(--gold-primary);
        box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
    }

    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }

    .form-actions {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
        margin-top: 2rem;
    }

    .cancel-btn {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
        padding: 0.7rem 1.5rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .cancel-btn:hover {
        border-color: var(--gold-primary);
        color: var(--gold-primary);
    }

    .submit-btn {
        background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
        border: none;
        color: var(--bg-primary);
        padding: 0.7rem 1.5rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
    }

    .submit-btn:hover {
        background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
        transform: scale(1.05);
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5);
    }

    /* ============================================================
       收藏夹页面样式
    ============================================================ */

    /* ---- 入场关键帧 ---- */
    @keyframes favFadeInUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes favFadeInScale {
        from { opacity: 0; transform: scale(0.92); }
        to   { opacity: 1; transform: scale(1); }
    }
    @keyframes favShimmer {
        0%   { background-position: -200% center; }
        100% { background-position: 200% center; }
    }
    @keyframes favPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
        50%      { box-shadow: 0 0 0 8px rgba(212, 175, 55, 0); }
    }
    @keyframes favFloat {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-4px); }
    }

    /* 页面头部 */
    .fav-header {
        text-align: center;
        margin-bottom: 3rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--border-color);
        animation: favFadeInUp 0.6s ease both;
    }
    .fav-main-title {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 0.6rem;
        border-bottom: none;
        padding-bottom: 0;
    }
    .fav-title-icon {
        display: inline-block;
        animation: favFloat 3s ease-in-out infinite;
        font-size: 2rem;
    }
    .fav-subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
        letter-spacing: 0.5px;
    }

    /* ---- 分类标签切换 ---- */
    .fav-tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 2.5rem;
        flex-wrap: wrap;
        justify-content: center;
        position: relative;
        padding-bottom: 4px;
        animation: favFadeInUp 0.6s ease 0.1s both;
    }
    /* 滑动指示器 — 白色短线 */
    .fav-tab-indicator {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--gold-primary), var(--gold-light));
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                    width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }
    .fav-tab-btn {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.6rem 1.2rem;
        background: rgba(26, 26, 26, 0.7);
        border: 1px solid rgba(42, 42, 42, 0.6);
        border-radius: 10px;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 0.9rem;
        font-family: inherit;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(8px);
        position: relative;
        white-space: nowrap;
    }
    .fav-tab-btn:hover {
        border-color: rgba(212, 175, 55, 0.4);
        color: var(--gold-primary);
        background: rgba(212, 175, 55, 0.06);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .fav-tab-btn:active {
        transform: translateY(0);
        transition: transform 0.1s ease;
    }
    .fav-tab-btn.active {
        background: rgba(212, 175, 55, 0.1);
        border-color: rgba(212, 175, 55, 0.5);
        color: var(--gold-primary);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
    }
    .fav-tab-icon {
        font-size: 1rem;
        line-height: 1;
        transition: transform 0.35s ease;
    }
    .fav-tab-btn:hover .fav-tab-icon {
        transform: scale(1.2) rotate(-10deg);
    }
    .fav-tab-btn.active .fav-tab-icon {
        transform: scale(1.15);
    }
    .fav-tab-label {
        letter-spacing: 0.3px;
    }
    .fav-tab-count {
        font-size: 0.72rem;
        background: rgba(212, 175, 55, 0.15);
        color: var(--gold-primary);
        padding: 0.1rem 0.5rem;
        border-radius: 10px;
        font-weight: 500;
        min-width: 1.4em;
        text-align: center;
        transition: all 0.35s ease;
    }
    .fav-tab-btn.active .fav-tab-count {
        background: rgba(212, 175, 55, 0.3);
        animation: favPulse 2s ease-in-out infinite;
    }
    .fav-tab-btn:hover .fav-tab-count {
        background: rgba(212, 175, 55, 0.25);
    }

    /* ---- 分类内容面板 ---- */
    .fav-category {
        margin-bottom: 3rem;
        animation: favFadeInScale 0.45s ease both;
    }
    .fav-category:last-child {
        margin-bottom: 0;
    }
    /* hidden 属性配合 CSS 隐藏，JS 通过 .active 控制显示 */
    .fav-category[hidden] {
        display: none;
    }

    /* 分类标题行 */
    .fav-cat-header {
        margin-bottom: 1.4rem;
    }
    .fav-cat-title {
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 0;
        padding-bottom: 0.7rem;
        border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .fav-cat-icon {
        font-size: 1.3rem;
        line-height: 1;
        display: inline-block;
        animation: favFloat 4s ease-in-out infinite;
    }
    /* 对每个分类设置不同的浮动延迟 */
    .fav-category:nth-child(1) .fav-cat-icon { animation-delay: 0s; }
    .fav-category:nth-child(2) .fav-cat-icon { animation-delay: 0.5s; }
    .fav-category:nth-child(3) .fav-cat-icon { animation-delay: 1s; }
    .fav-category:nth-child(4) .fav-cat-icon { animation-delay: 1.5s; }
    .fav-category:nth-child(5) .fav-cat-icon { animation-delay: 2s; }

    /* 分类计数徽标 */
    .fav-count {
        margin-left: auto;
        background: rgba(212, 175, 55, 0.12);
        color: var(--gold-primary);
        font-size: 0.78rem;
        font-weight: 500;
        padding: 0.15rem 0.65rem;
        border-radius: 20px;
        border: 1px solid rgba(212, 175, 55, 0.25);
        letter-spacing: 0;
    }

    /* ---- 链接网格 ---- */
    .fav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 0.9rem;
    }

    /* 单个收藏链接 — 卡片式 */
    .fav-item {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 1rem 1.15rem;
        background: linear-gradient(135deg, rgba(26, 26, 26, 0.7), rgba(18, 18, 18, 0.8));
        border: 1px solid rgba(42, 42, 42, 0.6);
        border-radius: 10px;
        text-decoration: none;
        color: inherit;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(8px);
        /* 默认隐藏，由 .fav-item--visible 触发入场 */
        opacity: 0;
        transform: translateY(16px);
    }
    /* 入场动画 — JS 添加此类触发 */
    .fav-item--visible {
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.5s ease,
                    transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1),
                    border-color 0.35s ease,
                    box-shadow 0.35s ease,
                    background 0.35s ease;
    }
    /* 使用 CSS 变量为每个卡片添加渐次延迟 */
    .fav-item--visible {
        transition-delay: var(--fav-item-delay, 0ms);
    }

    /* 顶部渐变条 — hover 时才显示 */
    .fav-item::after {
        content: '';
        position: absolute;
        top: 0;
        left: 10%;
        width: 80%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        opacity: 0;
        transition: opacity 0.4s ease;
    }
    .fav-item:hover {
        border-color: rgba(212, 175, 55, 0.45);
        transform: translateY(-4px) scale(1.01);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55),
                    0 0 0 1px rgba(212, 175, 55, 0.08) inset,
                    0 0 24px rgba(212, 175, 55, 0.08);
        background: linear-gradient(135deg, rgba(30, 30, 30, 0.8), rgba(22, 22, 22, 0.85));
    }
    .fav-item:hover::after {
        opacity: 1;
    }
    .fav-item:active {
        transform: translateY(-2px) scale(0.98);
        transition: transform 0.1s ease;
    }

    /* 光扫效果 — hover 时的微光 */
    .fav-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            105deg,
            transparent 40%,
            rgba(212, 175, 55, 0.04) 45%,
            rgba(212, 175, 55, 0.08) 50%,
            rgba(212, 175, 55, 0.04) 55%,
            transparent 60%
        );
        transition: left 0.6s ease;
        pointer-events: none;
        z-index: 0;
    }
    .fav-item:hover::before {
        left: 100%;
    }

    /* 图标容器 */
    .fav-item-icon {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        background: rgba(212, 175, 55, 0.06);
        border-radius: 10px;
        border: 1px solid rgba(212, 175, 55, 0.12);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        z-index: 1;
    }
    .fav-item:hover .fav-item-icon {
        background: rgba(212, 175, 55, 0.14);
        border-color: rgba(212, 175, 55, 0.35);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        transform: scale(1.08) rotate(-5deg);
    }

    /* 文字区域 */
    .fav-item-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        position: relative;
        z-index: 1;
    }
    .fav-item-title {
        font-size: 0.93rem;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.35s ease;
        letter-spacing: 0.3px;
    }
    .fav-item:hover .fav-item-title {
        color: var(--gold-light);
    }
    .fav-item-desc {
        font-size: 0.8rem;
        color: var(--text-muted);
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        transition: color 0.35s ease;
    }
    .fav-item:hover .fav-item-desc {
        color: var(--text-secondary);
    }

    /* 外链箭头 */
    .fav-item-arrow {
        flex-shrink: 0;
        color: var(--text-muted);
        font-size: 0.85rem;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        opacity: 0;
        transform: translateX(-6px);
        position: relative;
        z-index: 1;
    }
    .fav-item:hover .fav-item-arrow {
        opacity: 1;
        transform: translateX(0);
        color: var(--gold-primary);
    }

    /* ---- 空状态 ---- */
    .fav-empty {
        text-align: center;
        padding: 4rem 2rem;
        animation: favFadeInScale 0.5s ease both;
    }
    .fav-empty-icon {
        font-size: 4rem;
        display: block;
        margin-bottom: 1rem;
        animation: favFloat 3s ease-in-out infinite;
    }
    .fav-empty-text {
        color: var(--text-muted);
        font-size: 1rem;
        letter-spacing: 0.5px;
    }

    /* ---- 移动端适配 ---- */
    @media (max-width: 768px) {
        .fav-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
        }
        .fav-subtitle {
            font-size: 0.88rem;
        }
        .fav-category {
            margin-bottom: 2.5rem;
        }
        .fav-grid {
            grid-template-columns: 1fr;
            gap: 0.7rem;
        }
        .fav-item {
            padding: 0.85rem 1rem;
        }
        .fav-item-icon {
            width: 38px;
            height: 38px;
            font-size: 1.1rem;
            border-radius: 8px;
        }
        .fav-item-title {
            font-size: 0.88rem;
        }
        .fav-item-desc {
            font-size: 0.76rem;
        }
        .fav-cat-title {
            font-size: 1.05rem;
        }
        .fav-tabs {
            gap: 0.4rem;
            margin-bottom: 1.8rem;
        }
        .fav-tab-indicator {
            height: 2px;
        }
        .fav-tab-btn {
            padding: 0.45rem 0.8rem;
            font-size: 0.82rem;
            border-radius: 8px;
        }
        .fav-tab-icon {
            font-size: 0.9rem;
        }
        .fav-tab-count {
            font-size: 0.68rem;
        }
        .fav-empty {
            padding: 3rem 1rem;
        }
        .fav-empty-icon {
            font-size: 3rem;
        }
    }

    @media (max-width: 768px) {
        .search-modal {
            width: 95%;
            margin-top: 20px;
        }

        .search-input {
            font-size: 1rem;
        }

        .search-header {
            padding: 1rem;
        }

        .search-confirm {
            padding: 0.4rem 0.8rem;
            margin-left: 0.3rem;
        }

        .search-confirm-icon {
            width: 18px;
            height: 18px;
        }

        .search-close {
            font-size: 1.3rem;
            padding: 0.2rem 0.4rem;
        }

        /* 友情链接响应式 */
        .fl-grid {
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .fl-link {
            padding: 2rem 1.3rem 1.5rem;
        }

        .fl-avatar {
            width: 80px;
            height: 80px;
            margin-bottom: 1.1rem;
        }

        .fl-avatar-icon {
            font-size: 1.8rem;
        }

        .fl-name {
            font-size: 1.1rem;
        }

        .fl-bio {
            font-size: 0.88rem;
        }

        .fl-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
        }

        .fl-empty {
            padding: 3rem 1rem;
        }

        .fl-empty-icon {
            font-size: 3rem;
        }

        .add-link-btn {
            padding: 0.7rem 1.5rem;
            font-size: 0.9rem;
        }

        /* 模态框响应式 */
        .modal-content {
            width: 95%;
            margin-top: 20px;
        }

        .modal-header {
            padding: 1rem;
        }

        .modal-header h3 {
            font-size: 1.1rem;
        }

        .modal-body {
            padding: 1.2rem;
        }

        .form-group input,
        .form-group textarea {
            padding: 0.7rem;
            font-size: 0.95rem;
        }

        .form-actions {
            flex-direction: column;
        }

        .cancel-btn,
        .submit-btn {
            width: 100%;
            text-align: center;
        }
    }

    /* ============================================================
       全局动效增强
    ============================================================ */

    /* ---- 滚动渐入 ---- */
    .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.7s cubic-bezier(0.22, 0.61, 0.36, 1),
                    transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
        transition-delay: var(--reveal-delay, 0ms);
        will-change: opacity, transform;
    }
    .reveal.reveal-visible {
        opacity: 1;
        transform: translateY(0);
    }

    /* ---- 导航栏滚动收缩 ---- */
    body > header {
        transition: background 0.35s ease, box-shadow 0.35s ease;
    }
    body > header nav {

    .hero h1 {

    /* ---- 项目卡片顶部金边 — 与文章/友链卡片统一 ---- */
    .project-card {
        position: relative;
        overflow: hidden;
    }
    .project-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, var(--gold-light), var(--gold-primary));
        opacity: 0;
        transition: opacity 0.4s ease;

        opacity: 1;
    }

    /* ---- 金色选中文本 ---- */
    ::selection {
        background: rgba(212, 175, 55, 0.35);
        color: #ffffff;
    }

    /* ---- 黑金滚动条 ---- */
    ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
    }
    ::-webkit-scrollbar-track {
        background: #0a0a0a;
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(212, 175, 55, 0.3);
        border-radius: 5px;
        border: 2px solid #0a0a0a;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: rgba(212, 175, 55, 0.55);
    }

    /* ---- 金色漂浮粒子画布 ---- */
    #gold-dust {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    }

    /* ---- 卡片扫光 — 文章/项目/友链通用 ---- */
    .post-card::after,
    .project-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(105deg,
            transparent 42%,
            rgba(212, 175, 55, 0.04) 47%,
            rgba(212, 175, 55, 0.08) 50%,
            rgba(212, 175, 55, 0.04) 53%,
            transparent 58%);
        transition: left 0.7s ease;
        pointer-events: none;
    }
    .post-card:hover::after,
    .project-card:hover::after {
        left: 100%;
    }

    /* ---- 标题金色流光 ---- */
    .section-title {
        background: linear-gradient(120deg,
            var(--gold-primary) 0%, var(--gold-light) 40%,
            #fff3c4 50%, var(--gold-light) 60%, var(--gold-primary) 100%);

        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: goldShimmer 7s linear infinite;

    .avatar::after {
        content: '';
