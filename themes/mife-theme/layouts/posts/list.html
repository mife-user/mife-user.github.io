{{ define "main" }}
<section class="section list-page">
    <h2 class="section-title" data-zh="文章" data-en="ARTICLES">文章</h2>
    <div class="post-list" id="post-list">
        {{ range $index, $post := (where .Site.RegularPages "Section" "posts") }}
        <article class="post-card" data-post-index="{{ $index }}">
            <div class="post-meta">
                <div class="post-date">{{ .Date.Format "2006-01-02" }}</div>
                {{ with .Params.tags }}
                <div class="post-tags">
                    {{ range . }}
                    <a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}/" class="tag-link">{{ . }}</a>
                    {{ end }}
                </div>
                {{ end }}
            </div>
            <h3 class="post-title">
                <a href="{{ .Permalink }}">{{ .Title }}</a>
            </h3>
        </article>
        {{ end }}
    </div>
    <nav class="pagination" id="post-pagination" aria-label="文章分页"></nav>
</section>
{{ end }}
